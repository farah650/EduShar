# ========================
# APPLICATION CONFIG
# ========================
spring.application.name=edushare-backend
server.port=8081
# ========================
# DATABASE CONFIG
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/edushare_db
spring.datasource.username=root
spring.datasource.password=root
springdoc.swagger-ui.oauth.client-id=test-client
springdoc.swagger-ui.oauth.realm=test-realm
springdoc.swagger-ui.oauth.app-name=test-app
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
# ========================
# JPA / HIBERNATE CONFIG
# ========================
# Désactive temporairement la sécurité Spring Security
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ========================
# FILE UPLOAD CONFIG
# ========================
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.servlet.multipart.enabled=true

# ========================
# JWT CONFIG
# ========================
jwt.secret=mySecretKey12345678901234567890123456789012345678901234567890
jwt.expiration=86400000

# ========================
# LOGGING CONFIG
# ========================
logging.level.com.edushare_backend=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG